name: habib_data_hub
description: Habib Data Hub — VTU mobile app for airtime, data, bills and more.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.5.0

  # Local storage (secure token storage + cached prefs)
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  pin_code_fields: ^8.0.1
  flutter_slidable: ^3.1.1

  # Forms / validation
  form_field_validator: ^1.1.0

  # Payments webview (Paystack / Flutterwave checkout pages)
  webview_flutter: ^4.9.0

  # Push notifications
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2

  # PDF receipts (client-side share/view of server-generated PDF)
  open_filex: ^4.5.0
  path_provider: ^2.1.4
  dio_smart_retry: ^6.0.0

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.0
  uuid: ^4.5.0
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/images/
